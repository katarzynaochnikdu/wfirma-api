<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ustaw nowe hasło - Medidesk Admin V2</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-v2.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      background: var(--background);
      color: var(--foreground);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px hsl(212, 100%, 42%, 0.1);
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .alert-error {
      background: var(--destructive-bg);
      color: var(--destructive);
      border: 1px solid var(--destructive);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: var(--foreground);
    }
    .password-hint {
      font-size: 0.75rem;
      color: var(--muted-foreground);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="{{ url_for('static', filename='medidesk-logo.svg') }}" alt="Medidesk" height="40" onerror="this.style.display='none'">
      </div>
      <h1 class="login-title">Ustaw nowe hasło</h1>
      <p class="login-subtitle">Wprowadź nowe hasło do swojego konta</p>
    </div>
    
    {% if error %}
    <div class="alert alert-error">
      {{ error }}
    </div>
    {% endif %}
    
    <form method="POST">
      <input type="hidden" name="token" value="{{ token }}">
      
      <div class="form-group">
        <label class="form-label" for="password">Nowe hasło</label>
        <input type="password" id="password" name="password" class="form-input" required autofocus minlength="8" placeholder="Minimum 8 znaków">
        <p class="password-hint">Hasło musi mieć co najmniej 8 znaków</p>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password2">Powtórz hasło</label>
        <input type="password" id="password2" name="password2" class="form-input" required minlength="8" placeholder="Potwierdź nowe hasło">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Ustaw nowe hasło
      </button>
    </form>
    
    <a href="{{ url_for('admin_v2_bp.login') }}" class="back-link">
      ← Powrót do logowania
    </a>
  </div>
</body>
</html>
