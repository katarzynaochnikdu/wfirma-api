<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zapomniałem hasła - Medidesk Admin V2</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-v2.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      background: var(--background);
      color: var(--foreground);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px hsl(212, 100%, 42%, 0.1);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: var(--foreground);
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="{{ url_for('static', filename='medidesk-logo.svg') }}" alt="Medidesk" height="40" onerror="this.style.display='none'">
      </div>
      <h1 class="login-title">Zapomniałem hasła</h1>
      <p class="login-subtitle">Podaj swój adres email, a wyślemy link do resetowania hasła</p>
    </div>
    
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Adres email</label>
        <input type="email" id="email" name="email" class="form-input" required autofocus placeholder="twoj.email@firma.pl">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%;">
        Wyślij link resetujący
      </button>
    </form>
    
    <a href="{{ url_for('admin_v2_bp.login') }}" class="back-link">
      ← Powrót do logowania
    </a>
  </div>
</body>
</html>
