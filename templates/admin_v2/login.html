<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logowanie - Medidesk Admin V2</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-v2.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo {
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }
    .login-subtitle {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-top: 0.25rem;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.5rem;
      color: var(--foreground);
    }
    .form-input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.875rem;
      background: var(--background);
      color: var(--foreground);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px hsl(212, 100%, 42%, 0.1);
    }
    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    .alert-error {
      background: var(--destructive-bg);
      color: var(--destructive);
      border: 1px solid var(--destructive);
    }
    .alert-success {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid var(--success);
    }
    
    /* Iframe detection overlay */
    .iframe-overlay {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .iframe-overlay-icon {
      width: 64px;
      height: 64px;
      background: var(--muted);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .iframe-overlay-icon svg {
      width: 32px;
      height: 32px;
      color: var(--muted-foreground);
    }
    .iframe-overlay h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--foreground);
      margin: 0 0 0.75rem 0;
    }
    .iframe-overlay p {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin: 0 0 1.5rem 0;
      line-height: 1.5;
    }
    .iframe-overlay .open-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .iframe-overlay .open-btn:hover {
      background: hsl(212, 100%, 35%);
    }
    .iframe-overlay .open-btn svg {
      width: 18px;
      height: 18px;
    }
    /* Hide login content when in iframe */
    body.in-iframe .login-content {
      display: none;
    }
    body.in-iframe .iframe-overlay {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <!-- Iframe detection overlay -->
    <div class="iframe-overlay">
      <div class="iframe-overlay-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </div>
      <h2>Otwórz w nowej karcie</h2>
      <p>Ze względów bezpieczeństwa logowanie<br/>nie jest możliwe w ramce iframe.</p>
      <a href="{{ url_for('admin_v2_bp.login') }}" target="_blank" class="open-btn" onclick="window.open(this.href, '_blank'); return false;">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
        Otwórz panel logowania
      </a>
    </div>
    
    <!-- Normal login content - hidden when in iframe -->
    <div class="login-content">
    <div class="login-header">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="url(#logo-gradient)"/>
          <path d="M8 16L12 12L16 16L20 12L24 16" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 20L16 24L20 20" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="logo-gradient" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="hsl(160, 82%, 44%)"/>
              <stop offset="50%" stop-color="hsl(195, 100%, 42%)"/>
              <stop offset="100%" stop-color="hsl(212, 100%, 42%)"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1 class="login-title">Panel Admin V2</h1>
      <p class="login-subtitle">Zaloguj się, aby kontynuować</p>
    </div>
    
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    
    {% if success %}
    <div class="alert alert-success">{{ success }}</div>
    {% endif %}
    
    <form method="POST">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="admin@example.com" value="{{ request.form.get('email', '') }}">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="password">Hasło</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
      </div>
      
      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
        Zaloguj się
      </button>
    </form>
    
    <p style="text-align: center; margin-top: 1.5rem; font-size: 0.75rem; color: var(--muted-foreground);">
      <a href="/admin/login" style="color: var(--primary);">Przejdź do starego panelu</a>
    </p>
    </div><!-- end .login-content -->
  </div>
  
  <script>
    // Wykrywanie czy strona jest osadzona w iframe
    (function() {
      try {
        if (window.self !== window.top) {
          // Strona jest w iframe - pokaż overlay, ukryj formularz
          document.body.classList.add('in-iframe');
        }
      } catch (e) {
        // Błąd dostępu (cross-origin) - też oznacza iframe
        document.body.classList.add('in-iframe');
      }
    })();
  </script>
</body>
</html>
