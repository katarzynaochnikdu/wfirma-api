<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email wysłany - Medidesk Admin V2</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-v2.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--background);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      text-align: center;
    }
    .login-header {
      margin-bottom: 2rem;
    }
    .login-logo {
      margin-bottom: 1rem;
    }
    .login-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--foreground);
    }
    .success-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1rem;
      background: var(--success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .success-icon svg {
      width: 32px;
      height: 32px;
      color: var(--success);
    }
    .message {
      font-size: 0.875rem;
      color: var(--muted-foreground);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1rem;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      text-decoration: none;
    }
    .back-link:hover {
      color: var(--foreground);
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="{{ url_for('static', filename='medidesk-logo.svg') }}" alt="Medidesk" height="40" onerror="this.style.display='none'">
      </div>
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>
      <h1 class="login-title">Sprawdź swoją skrzynkę</h1>
    </div>
    
    <p class="message">
      Jeśli podany adres email jest zarejestrowany w systemie, wysłaliśmy na niego link do resetowania hasła.
      <br><br>
      Link jest ważny przez 1 godzinę.
    </p>
    
    <a href="{{ url_for('admin_v2_bp.login') }}" class="btn btn-outline" style="width: 100%;">
      Powrót do logowania
    </a>
  </div>
</body>
</html>
