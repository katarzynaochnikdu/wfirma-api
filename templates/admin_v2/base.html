<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} - Medidesk</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-v2.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="admin-layout">
    {% include 'admin_v2/_sidebar.html' %}

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="content-wrapper animate-fade-in">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <!-- Confirmation Dialog -->
  <div class="confirm-dialog-overlay" id="confirmDialog">
    <div class="confirm-dialog">
      <h3 class="confirm-dialog-title" id="confirmTitle">Potwierdzenie</h3>
      <p class="confirm-dialog-message" id="confirmMessage">Czy na pewno chcesz wykonać tę akcję?</p>
      <div class="confirm-dialog-actions">
        <button class="btn btn-outline" id="confirmCancel">Anuluj</button>
        <button class="btn btn-primary" id="confirmOk">Potwierdź</button>
      </div>
    </div>
  </div>

  <!-- Toast Container (Global) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Send Message Dialog (Global) -->
  {% include 'admin_v2/_send_message_dialog.html' %}

  <script>
    // Inicjalizuj ikony Lucide po załadowaniu DOM
    document.addEventListener('DOMContentLoaded', function() {
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
    });
    
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('collapsed');
    }
    
    function logout() {
      window.location.href = '{{ url_for("admin_v2_bp.logout") }}';
    }
    
    // Global Toast Function
    function showToast(message, type) {
      type = type || 'info';
      var container = document.getElementById('toast-container');
      if (!container) return;
      
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      
      var iconName = 'info';
      if (type === 'success') iconName = 'check-circle';
      else if (type === 'error') iconName = 'x-circle';
      else if (type === 'warning') iconName = 'alert-triangle';
      
      toast.innerHTML = '<i data-lucide="' + iconName + '" style="width: 16px; height: 16px;"></i><span>' + message + '</span>';
      container.appendChild(toast);
      
      if (typeof lucide !== 'undefined') {
        lucide.createIcons();
      }
      
      setTimeout(function() {
        toast.style.animation = 'slideOut 0.3s ease forwards';
        setTimeout(function() { toast.remove(); }, 300);
      }, 4000);
    }
    
    // Custom confirm dialog
    function showConfirmDialog(title, message, options) {
      options = options || {};
      var dialog = document.getElementById('confirmDialog');
      var titleEl = document.getElementById('confirmTitle');
      var msgEl = document.getElementById('confirmMessage');
      var okBtn = document.getElementById('confirmOk');
      var cancelBtn = document.getElementById('confirmCancel');
      
      titleEl.textContent = title || 'Potwierdzenie';
      msgEl.textContent = message || 'Czy na pewno chcesz wykonać tę akcję?';
      
      if (options.danger) {
        okBtn.className = 'btn btn-destructive';
      } else {
        okBtn.className = 'btn btn-primary';
      }
      okBtn.textContent = options.okText || 'Potwierdź';
      cancelBtn.textContent = options.cancelText || 'Anuluj';
      
      dialog.classList.add('active');
      
      return new Promise(function(resolve) {
        function cleanup() {
          dialog.classList.remove('active');
          okBtn.removeEventListener('click', handleOk);
          cancelBtn.removeEventListener('click', handleCancel);
          dialog.removeEventListener('click', handleOverlay);
        }
        function handleOk() { cleanup(); resolve(true); }
        function handleCancel() { cleanup(); resolve(false); }
        function handleOverlay(e) { if (e.target === dialog) { cleanup(); resolve(false); } }
        
        okBtn.addEventListener('click', handleOk);
        cancelBtn.addEventListener('click', handleCancel);
        dialog.addEventListener('click', handleOverlay);
      });
    }
  </script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
